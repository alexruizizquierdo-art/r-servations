<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173E6A"/>
      <stop offset="1" stop-color="#2878B0"/>
    </linearGradient>
    <linearGradient id="bm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DCAEC"/>
      <stop offset="1" stop-color="#3FA8D5"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Newspaper body -->
  <rect x="9" y="11" width="37" height="44" rx="5" fill="white" opacity="0.97"/>

  <!-- Blue header bar -->
  <rect x="9" y="11" width="37" height="11" rx="5" fill="#2878B0"/>
  <rect x="9" y="16" width="37" height="6" fill="#2878B0"/>

  <!-- Header text line -->
  <rect x="13" y="14" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.9)"/>

  <!-- Divider -->
  <rect x="11" y="25" width="33" height="1" rx="0.5" fill="rgba(46,120,176,0.2)"/>

  <!-- Article lines -->
  <rect x="13" y="28" width="30" height="3.5" rx="1.75" fill="rgba(20,60,110,0.45)"/>
  <rect x="13" y="34" width="22" height="2.5" rx="1.25" fill="rgba(20,60,110,0.22)"/>
  <rect x="13" y="39" width="27" height="2.5" rx="1.25" fill="rgba(20,60,110,0.22)"/>
  <rect x="13" y="44" width="18" height="2.5" rx="1.25" fill="rgba(20,60,110,0.22)"/>

  <!-- Bookmark ribbon -->
  <path d="M 36 7 L 56 7 L 56 38 L 46 31 L 36 38 Z" fill="url(#bm)"/>

  <!-- Star on bookmark -->
  <text x="46" y="24" text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="10" font-weight="bold" font-family="Arial,sans-serif">★</text>
</svg>
